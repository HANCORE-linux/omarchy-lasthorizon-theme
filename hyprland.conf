general {
    col.active_border = rgba(0c0b0cee) rgba(e2dddcee)
}

decoration {
    rounding = 3
    rounding_power = 3
    shadow {
      enabled = yes
      render_power = 3
      range = 16
      color = rgba(00000052)
    }
}